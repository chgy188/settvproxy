apply plugin: 'com.android.application'

android {
    namespace 'com.example.settvproxy'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.settvproxy"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// 源码含中文注释，固定 UTF-8，避免 Windows GBK 环境下编译失败
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // 不依赖任何第三方库，仅使用 Android 框架，便于离线构建
}
